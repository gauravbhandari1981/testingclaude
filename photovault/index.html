<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoVault</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>PhotoVault</h1>
  <span id="count">0 photos</span>
</header>

<main>
  <div id="dropzone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 16v-8m0 0-3 3m3-3 3 3M4 16.5A2.5 2.5 0 0 0 6.5 19h11a2.5 2.5 0 0 0 2.5-2.5V15a5 5 0 0 0-5-5h-1"/>
    </svg>
    <p>Drop photos here or <label for="fileInput">browse</label></p>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
  </div>

  <div id="gallery"></div>
</main>

<!-- Lightbox -->
<div id="lightbox">
  <button id="close">✕</button>
  <button id="prev">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button id="next">›</button>
  <div id="lightboxInfo"></div>
</div>

<script src="app.js"></script>
</body>
</html>
